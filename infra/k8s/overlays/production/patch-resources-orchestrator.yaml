apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-orchestrator-service
  namespace: rag-platform
spec:
  template:
    spec:
      containers:
        - name: llm-orchestrator-service
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
