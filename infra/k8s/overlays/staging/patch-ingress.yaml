apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-platform-ingress
  namespace: rag-platform
spec:
  ingressClassName: nginx
  rules:
    - host: staging-api.rag-platform.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
