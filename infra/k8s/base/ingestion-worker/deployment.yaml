apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: rag-platform
  labels:
    app: ingestion-worker
    app.kubernetes.io/part-of: rag-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-worker
  template:
    metadata:
      labels:
        app: ingestion-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/ORG/rag-platform/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: rag-platform-config
            - secretRef:
                name: rag-platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
