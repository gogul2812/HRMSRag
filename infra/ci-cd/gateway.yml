# Source of truth: .github/workflows/gateway.yml
# GitHub Actions only loads workflows from .github/workflows/.
# This file is kept for Module 6 layout parity.

name: CI — gateway

on:
  push:
    branches: [main]
    paths:
      - services/gateway/**
      - infra/docker/Dockerfile.gateway
      - shared-libs/**
      - ai-core/**
  pull_request:
    branches: [main]
    paths:
      - services/gateway/**
      - infra/docker/Dockerfile.gateway
      - shared-libs/**
      - ai-core/**
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: gateway
      service_path: services/gateway
      dockerfile: infra/docker/Dockerfile.gateway
      context: "."

    secrets: inherit
