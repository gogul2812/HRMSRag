[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-evals"
version = "0.1.0"
description = "RAGAS-style evaluation and load-test harness for RAG Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
ragas = ["ragas>=0.1.21", "datasets>=2.19.0", "langchain-community>=0.2.0"]
load = ["locust>=2.28.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rag-eval = "rag_platform_evals.cli:main"
rag-load = "rag_platform_evals.load.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
