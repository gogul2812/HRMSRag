[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-ai-core"
version = "0.1.0"
description = "Shared AI library (parse → chunk → embed) for the RAG Platform"
requires-python = ">=3.11"
dependencies = [
    "rag-platform-parsing",
    "rag-platform-chunking",
    "rag-platform-embedding",
    "rag-platform-reranking",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
