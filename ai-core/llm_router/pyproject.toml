[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-llm-router"
version = "0.1.0"
description = "litellm fallback router for RAG Platform ai-core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # Pin below 1.92: newer source builds need Rust/Cargo on some Windows machines
    "litellm>=1.40.0,<1.92.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
