[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-llm-orchestrator-service"
version = "0.1.0"
description = "LLM orchestration microservice (prompt assembly, sensitivity routing, guardrails)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3.0",
    "rag-platform-schemas",
    "rag-platform-auth-middleware",
    "rag-platform-observability",
    "rag-platform-llm-router",
    "rag-platform-pii",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
