[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-admin-config-service"
version = "0.1.0"
description = "Admin config microservice for RAG Platform (prompt configs + guardrail policies)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3.0",
    "rag-platform-schemas",
    "rag-platform-auth-middleware",
    "rag-platform-observability",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "aiosqlite>=0.20.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
