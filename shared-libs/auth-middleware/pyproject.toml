[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-auth-middleware"
version = "0.1.0"
description = "Shared JWT validation and auth dependencies for RAG Platform FastAPI services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1",
    "python-jose[cryptography]>=3.3.0,<4",
    "rag-platform-schemas",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
